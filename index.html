<script>
(() => {
  const root=document.getElementById('fashion-expanded-1023');
  const toc=document.getElementById('expanded-toc-1023');
  const container=document.getElementById('expanded-methods-1023');
  const data=JSON.parse(document.getElementById('expanded-flow-data-1023').textContent);
  const ns='http://www.w3.org/2000/svg';
  const canvas=document.createElement('canvas');
  const context=canvas.getContext('2d');
  const charts=[];
  function svgEl(name,attrs,text){
    const n=document.createElementNS(ns,name);
    Object.entries(attrs||{}).forEach(([k,v])=>n.setAttribute(k,String(v)));
    if(text!==undefined)n.textContent=text;
    return n;
  }
  function wrap(text,width,font){
    context.font=font;
    let line='';const lines=[];
    const chunks=text.match(/[A-Za-z0-9@_./–—+-]+|\s+|[^\x00-\x7F]|./gu)||[];
    for(const chunk of chunks){
      if(line && context.measureText(line+chunk).width>width){lines.push(line.trimEnd());line=chunk.trimStart();}
      else line+=chunk;
    }
    if(line)lines.push(line.trimEnd());
    return lines;
  }
  data.routes.forEach((route,index)=>{
    const section=document.createElement('section');section.id=route.id;
    const heading=document.createElement('h2');heading.textContent=`${index+1}. ${route.name}`;section.appendChild(heading);
    const anchor=document.createElement('a');anchor.href=`#${route.id}`;anchor.textContent=`${index+1}. ${route.name}`;
    anchor.addEventListener('click',event=>{event.preventDefault();section.scrollIntoView({behavior:'auto',block:'start'});});toc.appendChild(anchor);
    const back=document.createElement('a');back.href='#';back.textContent='返回目录';back.className='text-small';
    back.addEventListener('click',event=>{event.preventDefault();root.scrollIntoView({behavior:'auto',block:'start'});});section.appendChild(back);
    const branches=data.variants[route.id] || [{id:route.id,name:'',steps:route.steps}];
    branches.forEach((branch,bIndex)=>{
      if(branch.name){const h=document.createElement('h3');h.textContent=`分支 ${bIndex+1}｜${branch.name}`;section.appendChild(h);}
      const figure=document.createElement('figure');
      const svg=svgEl('svg',{role:'img','aria-label':route.name+(branch.name?'：'+branch.name:'')});
      figure.appendChild(svg);section.appendChild(figure);
      charts.push({svg,steps:branch.steps,id:`flow-arrow-${index}-${bIndex}`});
    });
    container.appendChild(section);
  });
  function draw(chart){
    const {svg,steps,id}=chart;
    const width=Math.max(240,svg.parentElement.getBoundingClientRect().width||736);
    const computed=getComputedStyle(root);
    const base=parseFloat(computed.getPropertyValue('--font-size-base'))||parseFloat(computed.fontSize)||14;
    const font=`${base}px ${computed.fontFamily}`,lineHeight=base*1.5;
    const cols=width>=660?2:1,gapX=42,gapY=34,margin=8;
    const boxWidth=(width-2*margin-gapX*(cols-1))/cols;
    svg.replaceChildren(svgEl('title',{},svg.getAttribute('aria-label')),svgEl('desc',{},steps.map(s=>s.join('。')).join('；')));
    const defs=svgEl('defs');
    const marker=svgEl('marker',{id,viewBox:'0 0 10 10',refX:9,refY:5,markerWidth:6,markerHeight:6,orient:'auto-start-reverse'});
    marker.appendChild(svgEl('path',{d:'M0 1 L9 5 L0 9',fill:'none',stroke:'var(--muted-foreground)','stroke-width':1.4}));
    defs.appendChild(marker);svg.appendChild(defs);
    const blocks=steps.map((step,i)=>{
      const lines=[];
      wrap(`${i+1}. ${step[0]}`,boxWidth-28,`500 ${font}`).forEach(t=>lines.push({t,title:true}));
      [`工具 / 输入：${step[1]}`,`提示词 / 操作要点：${step[2]}`,`验收 / 条件出口：${step[3]}`].forEach(part=>{
        lines.push({gap:true});wrap(part,boxWidth-28,font).forEach(t=>lines.push({t}));
      });
      return {lines,height:lines.reduce((h,l)=>h+(l.gap?base*0.45:lineHeight),0)+28};
    });
    const positions=[];let y=8;
    for(let start=0;start<blocks.length;start+=cols){
      const row=Math.floor(start/cols),rowBlocks=blocks.slice(start,start+cols),rowHeight=Math.max(...rowBlocks.map(b=>b.height));
      rowBlocks.forEach((block,j)=>{
        const col=cols===2&&row%2===1?cols-1-j:j,x=margin+col*(boxWidth+gapX);
        positions.push({x,y,width:boxWidth,height:rowHeight,row,col});
        svg.appendChild(svgEl('rect',{x,y,width:boxWidth,height:rowHeight,rx:6,fill:'var(--muted)','fill-opacity':0.55,stroke:'var(--border)','stroke-width':1}));
        let ty=y+16+base;
        block.lines.forEach(line=>{
          if(line.gap){ty+=base*0.45;return;}
          svg.appendChild(svgEl('text',{x:x+14,y:ty,class:line.title?'step-title':''},line.t));ty+=lineHeight;
        });
      });
      y+=rowHeight+gapY;
    }
    positions.forEach((now,i)=>{
      if(!i)return;const before=positions[i-1];let d;
      if(now.row===before.row){
        const right=now.x>before.x;
        d=`M ${right?before.x+before.width+4:before.x-4} ${before.y+before.height/2} L ${right?now.x-6:now.x+now.width+6} ${now.y+now.height/2}`;
      }else d=`M ${before.x+before.width/2} ${before.y+before.height+4} L ${now.x+now.width/2} ${now.y-6}`;
      svg.appendChild(svgEl('path',{d,fill:'none',stroke:'var(--muted-foreground)','stroke-width':1.2,'marker-end':`url(#${id})`}));
    });
    svg.setAttribute('viewBox',`0 0 ${width} ${y}`);svg.style.height=`${y}px`;
  }
  let previousWidth=0;
  function render(){
    const width=root.getBoundingClientRect().width;
    if(width===previousWidth&&charts.every(c=>c.svg.hasAttribute('viewBox')))return;
    previousWidth=width;charts.forEach(draw);
  }
  new ResizeObserver(render).observe(root);render();
})();
</script>
